[pytest]
; Default collection is the pure unit-test suite (tests/unit), which needs no
; live server, no Mongo, and no sample fixtures. The legacy end-to-end suite in
; tests/ (test_backend.py, test_corrections.py, test_features.py) hits a running
; deployment directly and is run explicitly, not as part of `pytest`/coverage.
testpaths = tests/unit
python_files = test_*.py
