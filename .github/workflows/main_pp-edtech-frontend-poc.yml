name: Build and deploy React app - pp-edtech-frontend-poc

on:
  push:
    branches: [ main ]
    paths: [ 'frontend/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: frontend
        run: |
          npm install
          npm run build
        env:
          CI: false
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: react-app
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: react-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CFC59F5D46824511BD5277352988D3DB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EEA83F1923994F4FA44BB3284524FE96 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C5AFD5C75994D1384FBB1A04A1DBFC1 }}
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pp-edtech-frontend-poc'
          slot-name: 'Production'
          package: .
