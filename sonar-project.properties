# =====================================================================
# SonarQube Project Configuration — EdTech Ops Hub
# =====================================================================

# Unique Project Keys & Metadata
sonar.projectKey=EdTech-Ops-Hub
sonar.projectName=EdTech Ops Hub
sonar.projectVersion=1.0.0

# Source Analysis Boundaries
sonar.sources=backend,frontend/src
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Frontend tests are co-located with the components they test (Foo.jsx /
# Foo.test.jsx in the same folder), so — unlike the backend's separate
# tests/ directory — they need a glob-based test.inclusions entry instead of
# a separate sonar.tests path, otherwise these files get analyzed as MAIN
# code and count against new_coverage even though nothing tests the tests.
sonar.test.inclusions=frontend/src/**/*.test.jsx,frontend/src/**/*.test.js

# File Exclusion Rules (Exclude test directory from main sources to prevent duplicate indexing)
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/__pycache__/**,**/venv/**,**/coverage/**,**/docs/**,**/*.pdf,**/*.png,**/*.jpg,backend/tests/**

# Language Specifications
sonar.python.version=3.10
sonar.javascript.environments=browser,node

# Coverage reports — generated by:
#   backend: pytest --cov=. --cov-branch --cov-report=xml  (from backend/)
#   frontend: npm run test:coverage                          (from frontend/)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
